<!-- TRANSITION  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
    }
    .box{
        background-color: blue;
        height: 300px;
        width: 300px;
        transition: scale 0.3s ease, rotate 0.6s, background-color 0.3s ease-in-out, border-radius 1s ease, transform 0.8s ease;
    }
    .box:hover{
        scale: 1.25;
        rotate: 180deg;
        background-color: black;
        border-radius: 500px;
        transform: translateY(70px);
    }
</style>
<body>
    <!-- Transition practice  -->
     <div class="parent">   
        <div class="box">

        </div>
     </div>
</body>
</html>
