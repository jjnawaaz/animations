<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
    }
    .child-1{
        height: 300px;
        width: 300px;
        clip-path: circle(40%);
        background-color: red;
    }
    .child-2{
        height: 300px;
        width: 300px;
        clip-path: circle(40% at 50% 35%);
        background-color: blue;
    }
</style>
<body>
    <div class="parent">
        <div class="child-1">
            
        </div>
        <div class="child-2">

        </div>
    </div>
</body>
</html>
