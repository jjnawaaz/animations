<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    .parent{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background-color: black;
    }
    .box{
        height: 300px;
        width: 300px;
        background-color: aqua;
        border: 2px solid black;  
        transition: border-radius 0.5s ease;      
    }
    .box:hover{
        border-radius: 200px;
        
    }
</style>
<body>
    <div class="parent">
        <div class="box">
        
        </div>
    </div>
</body>
</html>
