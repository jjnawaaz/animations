<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        perspective: 800px;
        row-gap: 30px;
        border: 2px solid black;
    }
    .child-1{
        height: 300px;
        width: 300px;
        background-color: black;
        transform: translateZ(0px);
    }
    .child-2{
        height: 300px;
        width: 300px;
        background-color: rgb(80, 74, 74);
        transform: translateZ(-200px);

    } 
    .child-3{
        height: 300px;
        width: 300px;
        background-color: rgb(194, 52, 52);
        transform: translateZ(200px);

    } 
    
</style>
<body>
    <div class="parent">
        <div class="child-1">
            
        </div>
        <div class="child-2">

        </div>
        <div class="child-3">

        </div>
    </div>
</body>
</html>
