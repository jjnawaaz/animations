<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
    }
    .child-1{
        background-color: black;
        width: 300px;
        height: 400px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        row-gap: 30px;
        align-items: center;
        clip-path: polygon(
            50% 0%, 
            50% 0%,
            53% 100%,
            47% 100%
        );
        transition: clip-path 1s ease-in-out;
    }
    .child-1 img{
        width: 100%;
        height: 70%;
        object-fit: cover;
        display: block;
    }
    .text{
        color: white;
    } 
    .child-1:hover{
         clip-path: polygon(
            0% 0%, 
            100% 0%,
            100% 100%,
            0% 100%
        );
    }
</style>
<body>
    <div class="parent">
        <div class="child-1">
            <img src="https://gamedaily.com/.image/MTU6MDAwMDAwMDAwMDU0MjMz/gta-6-lucia-boxing.jpg" alt="image">
            <div class="text">
                This is lucia caminos
            </div>
        </div>
    </div>
</body>
</html>
