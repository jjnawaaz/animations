<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent{
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        perspective: 800px;
        row-gap: 30px;
        flex-direction: column;
    }
    .child-1{
        height: 300px;
        width: 300px;
        background-color: black;
        transition: transform 0.7s ease-in-out;
    }
    .child-2{
        height: 300px;
        width: 300px;
        background-color: rgb(80, 74, 74);
        transition: transform 0.7s ease-in-out;
    } 
    .child-3{
        height: 300px;
        width: 300px;
        background-color: rgb(194, 52, 52);
        transition: transform 0.7s ease-in-out;
    } 
    .child-1:hover{
        transform: rotateX(180deg);
    }
    .child-2:hover{
        transform: rotateY(180deg);
    }
    .child-3:hover{
        transform: rotateZ(180deg);
    }
</style>
<body>
    <div class="parent">
        <div class="child-1">
            
        </div>
        <div class="child-2">

        </div>
        <div class="child-3">

        </div>
    </div>
</body>
</html>
