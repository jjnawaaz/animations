<!-- SCROLL ANIMATIONS  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .box{
        height: 200px;
        width: 200px;
        background-color: black;
        position: absolute;
    }
</style>
<body>
    <div class="box">

    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.8/dist/lenis.min.js"></script>
<script>
    const box = document.querySelector(".box")
    let previousX = 0;
    let previousY = 0;
    let velocityX = 0;
    let velocityY = 0;

    let positionX = 0;
    let positionY = 0;
    document.addEventListener("mousemove",(event)=>{
       let currentX = event.clientX
       let currentY = event.clientY

       velocityX = currentX - previousX
       velocityY = currentY - previousY

       previousX = currentX
       previousY = currentY

    })
    const lenis = new Lenis({
        lerp: 0.05
    });

function raf(time) {
    lenis.raf(time);
    positionX += velocityX;
    positionY += velocityY;
    velocityX *= 0.9;
    velocityY *= 0.9;
    gsap.set(box, {
        x: positionX,
        y: positionY
    });
    requestAnimationFrame(raf);
}


requestAnimationFrame(raf);
</script>
</html>
