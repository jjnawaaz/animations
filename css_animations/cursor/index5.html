<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box {
            position: fixed;
            width: 50px;
            height: 50px;
            background: black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

<div class="box"></div>

<script>
    const box = document.querySelector(".box");

    let currentX = 0;
    let currentY = 0;

    let velocityX = 0;
    let velocityY = 0;

    let targetX = 0;
    let targetY = 0;

    window.addEventListener("mousemove", (event) => {
        targetX = event.clientX;
        targetY = event.clientY;
    });

    function animate() {

        // Acceleration toward target
        velocityX += (targetX - currentX) * 0.1;
        velocityY += (targetY - currentY) * 0.1;

        // Friction
        velocityX *= 0.8;
        velocityY *= 0.8;

        // Apply velocity
        currentX += velocityX;
        currentY += velocityY;

        box.style.top = `${currentY}px`
        box.style.left = `${currentX}px`

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
