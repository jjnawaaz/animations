<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111;
    }
    .container{
        width: 200px;
        height: 400px;
        display: grid;
        place-items: center;
    }
    .card{
        width: 200px;
        height: 120px;
        background: blue;
        border-radius: 15px;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        color: white;
        font-size: 24px;
    }
    .card.expanded{
        width: 400px;
        height: 300px;
    }
</style>
<body>
    <div class="container">
        <div class="card">
            PRODUCT
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/Flip.min.js"></script>
<script>
    gsap.registerPlugin(Flip)

    const card = document.querySelector(".card")

    card.addEventListener("click",()=>{
        const state = Flip.getState(card)

        card.classList.toggle("expanded")

        Flip.from(state,{
            duration: 1,
            ease: "power2.inOut"
        })
    })
</script>
</html>
