<!-- MASK PAGE TRANSITION  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .page{
        position: fixed;
        inset:0
    }
    .page1{
        background-color: black;
    }
    .page2{
        background-color: blue;
        mask: url(#reveal)
    }
</style>
<body>
    <section class="page page1"></section>
    <svg>
        <defs>
            <mask id="reveal">
                <rect width="0" height="100vh" fill="white"/>
            </mask>
        </defs>    
    </svg>
     <section class="page page2"></section>
</body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
    gsap.to("#reveal rect",{
        attr: {
            width: "100vw"
        },
        duration: 1
    })
</script>
</html>
