<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 400vh
        }
        .boxes{
            height:auto;
            margin-top: 100vh
        }
       .box1{
        width: 200px;
        height: 200px;
        background-color: black;
       }
       .box2{
        width: 200px;
        height: 200px;
        background-color: rgb(239, 5, 5);
       }
       .box3{
        width: 200px;
        height: 200px;
        background-color: rgb(0, 126, 244);
       }
</style>
<body>
    <div class="boxes">
        <div class="box1">

        </div>
        <div class="box2">

        </div>
        <div class="box3">

        </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
     <script>
      const t1 = gsap.timeline({
        scrollTrigger: {
            trigger: ".boxes",
            start: "top bottom",
            end: "+=1200",
            scrub: true,
            markers: true,
            snap: 1 / 3
        }
      })
      t1.to(".box1",{
        width: "100%"
      })
      .to(".box2",{
        width: "100%"
      })
      .to(".box3",{
        width: "100%"
      })
     </script>
</body>
</html>
