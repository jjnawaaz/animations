<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 300vh;
        }

        .box {
            width: 200px;
            height: 200px;
            background: black;
            margin-top: 100vh;
        }
</style>
<body>
    <div class="box">

    </div>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
     <script>
        gsap.registerPlugin(ScrollTrigger);
        gsap.to(".box",{
            x: 500,
            rotation: 360,

            scrollTrigger:{
                trigger: ".box",
                start: "top bottom",
                end: "top top",
                scrub: true,
                markers: true
            }
        })
     </script>
</body>
</html>
