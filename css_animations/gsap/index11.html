<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 300vh;
        }

        .box1 {
            margin-top: 200vh;
            width: 200px;
            height: 200px;
            background: black;
        }
        .box2 {
            width: 200px;
            height: 200px;
            background: red;
        }
        .box3 {
            width: 200px;
            height: 200px;
            background: blue;
        }
</style>
<body>
    <div class="boxes">
        <div class="box1">

    </div>
    <div class="box2">

    </div>
    <div class="box3">

    </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
     <script>
       const tl = gsap.timeline({
    scrollTrigger: {
        trigger: ".boxes",
        start: "top center",
        end: "bottom top",
        scrub: 2,
        markers: true
    }
});

tl.to(".box1", {
    width: "100%"
})
.to(".box2", {
    width: "100%"
})
.to(".box3", {
    width: "100%"
});
     </script>
</body>
</html>
