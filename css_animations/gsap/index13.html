<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .section{
            height:300vh;
            padding-top: 100vh
        }
       .box{
        width: 200px;
        height: 200px;
        background-color: black;
       }
</style>
<body>
    <div class="section">
        <div class="box">

        </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
     <script>
       gsap.to(".box",{
        rotation: 360,
        scale: 2,
        scrollTrigger:{
            trigger: ".box",
            start: "top center",    // trigger point in element - viewport point
            end: "bottom top",
            scrub: true,
            pin: true,
            markers: true
        }
       })
     </script>
</body>
</html>
