<!-- GSAP BASICS  -->
<!-- gsap.from() -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .box{
        height: 500px;
        width: 500px;
        background-color: black;
        margin: 200px;
    }
</style>
<body>

    <div class="box">

    </div>

     <!-- 2. Load the core GSAP library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
     <!-- 3. Write your custom GSAP animation code -->
    <script>
        // Animates the element with the class '.box'
       gsap.from(".box",{
        x: 300,    // these are pixel units 
        rotation: 180,  // degrees
        scale: 1.5,
        duration: 1    // seconds
       })
    </script>
</body>
</html>
