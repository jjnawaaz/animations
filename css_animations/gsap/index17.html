<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .section{
        margin-top: 100vh;
    }
    .box{
        height: 500px;
        width: 500px;
        background-color: black;
    }
</style>
<body>
    <div class="section">
        <div class="box"></div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<script>
    gsap.registerPlugin(ScrollTrigger);
    const mm = gsap.matchMedia()
    mm.add("(min-width: 768px)", ()=>{
        gsap.to(".box",{
            x:500,
            rotation:360,
            scrollTrigger: {
                trigger: ".box",
                start: "top center",
                end: "top top",
                scrub: true,
                pin: true,
                markers: true
            }
        })
    })
    mm.add("(max-width: 767px)", () => {

        gsap.to(".box", {
            x: 100,
            rotation: 180,

            scrollTrigger: {
                trigger: ".box",
                start: "top center",
                end: "top top",
                scrub: true,
                markers: true
            }
        });
    })
</script>
</html>
