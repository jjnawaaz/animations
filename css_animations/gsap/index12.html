<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 400vh;
        }
        .hero-section{
            height: 100vh;
        }
        .animation-section{
            height: 100vh;
        }
       .animation-section .box{
        background-color: black;
        height: 300px;
        width: 300px;
       }
</style>
<body>
    <div class="hero-section">
       
    </div>
    <div class="animation-section">
    <div class="box">

    </div>
    </div>
    <div class="footer-section">
       
    </div>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
     <script>
       gsap.to(".box",{
        rotation: 360,
        scrollTrigger:{
            trigger: ".box",
            start: "center bottom",    // trigger point in element - viewport point
            end: "bottom center",
            scrub: true,
            // pin: true,
            markers: true
        }
       })
     </script>
</body>
</html>
