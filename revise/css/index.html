<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Product Card</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .section{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;  
        perspective: 500px;
    }
    .card{
        height: 300px;
        width: 300px;
        position: relative;
        transition: transform ease-in-out 1s;  
        transform-style: preserve-3d;
    }
    .frontcard{
        position: absolute;
        inset: 0;
        background-color: black;
        height: 100%;
        width: 100%;  
        backface-visibility: hidden; 
    }
    .backcard{
        position: absolute;
        inset: 0;
        background-color: blue;
        height: 100%;
        width: 100%;
        transform: rotateY(180deg);
        backface-visibility: hidden;
    }
    .card:hover{
        transform: rotateY(180deg) scale(1.25) translateY(-50px);
    }
</style>
<body>
    <div class="section">
        <div class="card">
        <div class="frontcard"></div>
        <div class="backcard"></div>
    </div>
    </div>
</body>
<script>
</script>
</html>
